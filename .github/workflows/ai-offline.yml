# 离线协议回归不要求模型服务或声学模型下载。
name: ai-offline

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai/**'
      - '.github/workflows/ai-offline.yml'

permissions:
  contents: read

concurrency:
  group: ai-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: 安装离线测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic-ai-slim[openai]==2.52.0" "pydantic-graph==2.52.0" "jsonschema==4.26.0" "numpy>=2.0,<2.3" "Pillow>=10.0"

      - name: 离线测试子集
        env:
          PYTHONPATH: ${{ github.workspace }}\ai;${{ github.workspace }}\ai\tests
        run: |
          python -m unittest tests.test_report_guards tests.test_modern_execution tests.test_tool_guards tests.test_configurable_workflow tests.test_explanation_guard tests.test_cloud_prompt
