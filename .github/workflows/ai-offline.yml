# 离线门禁：只跑不需要 Praat.exe、也不需要模型服务的东西。
#
# 为什么不直接 `pip install -r requirements.txt`：它会把 torch / praat-parselmouth /
# pythonnet / pywebview 一起拉进来（几 GB，且与离线测试无关）。下面只装离线测试真正
# 用到的包，保证 job 在几分钟内跑完。
#
# 真模型门禁（golden_backend.py --model live）不进 CI：它要 API key、要替身 Praat 之外的
# 环境，属于发版前手工执行的检查。
name: ai-offline

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai/**'
      - '.github/workflows/ai-offline.yml'

permissions:
  contents: read

concurrency:
  group: ai-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: 安装离线测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic-ai-slim[openai]==2.52.0" "pydantic-graph==2.52.0" "jsonschema==4.26.0" "numpy>=2.0,<2.3" "Pillow>=10.0"

      - name: 离线测试子集
        env:
          PYTHONPATH: ${{ github.workspace }}\ai;${{ github.workspace }}\ai\tests
        run: |
          python -m unittest tests.test_report_guards tests.test_report_audit tests.test_router tests.test_execution_core tests.test_delivery_text tests.test_telemetry tests.test_modern_execution tests.test_tool_guards tests.test_configurable_workflow tests.test_report_chain_regressions tests.test_explanation_guard tests.test_evidence_consistency tests.test_cloud_prompt

      - name: 黄金集门禁（离线骨架，不联网）
        env:
          PYTHONPATH: ${{ github.workspace }}\ai
        run: |
          python tests/golden_backend.py --model mock --runs 1 --min-verified 0 --out golden_backend.json
