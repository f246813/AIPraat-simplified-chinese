<style>
#mono-web{--mw-bg:#fafafa;--mw-panel:#fff;--mw-side:#f2f2f2;--mw-text:#1c1c1c;--mw-muted:#686868;--mw-line:#dedede;--mw-hover:#e6e6e6;--mw-glass:rgba(255,255,255,.86);--mw-radius:7px;color:var(--mw-text);font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif;color-scheme:light}
#mono-web[data-theme=dark]{--mw-bg:#181818;--mw-panel:#202020;--mw-side:#141414;--mw-text:#ededed;--mw-muted:#aaa;--mw-line:#3b3b3b;--mw-hover:#303030;--mw-glass:rgba(32,32,32,.88);color-scheme:dark}
#mono-web *{box-sizing:border-box}#mono-web [hidden]{display:none!important}#mono-web button,#mono-web input,#mono-web textarea,#mono-web select{font:inherit;color:inherit}#mono-web button{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--mw-panel);border:1px solid var(--mw-line);border-radius:var(--mw-radius);padding:8px 12px;transition:background .15s}#mono-web button:hover{background:var(--mw-hover)}#mono-web button:focus-visible,#mono-web input:focus-visible,#mono-web textarea:focus-visible,#mono-web select:focus-visible{outline:2px solid var(--mw-text);outline-offset:3px}#mono-web .mw-primary{background:var(--mw-text);color:var(--mw-panel);border-color:var(--mw-text)}#mono-web .mw-primary:hover{opacity:.85}#mono-web .mw-window{height:586px;background:var(--mw-bg);border:1px solid var(--mw-line);border-radius:10px;display:grid;grid-template-columns:212px minmax(0,1fr);position:relative;isolation:isolate}#mono-web .mw-sidebar{background:var(--mw-side);padding:24px 14px 18px;display:flex;flex-direction:column;gap:10px;border-right:1px solid var(--mw-line);border-radius:10px 0 0 10px;min-width:0}#mono-web .mw-brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;padding:0 6px 13px;letter-spacing:-.5px}#mono-web .mw-brand small{display:block;font-size:11px;font-weight:400;color:var(--mw-muted);letter-spacing:1px}#mono-web .mw-search{display:flex;gap:8px;align-items:center;background:var(--mw-panel);border:1px solid var(--mw-line);border-radius:var(--mw-radius);padding:8px 10px}#mono-web .mw-search input{min-width:0;width:100%;border:0;background:transparent;font-size:12px}#mono-web .mw-label{font-size:11px;color:var(--mw-muted);padding:10px 8px 2px}#mono-web .mw-history{display:flex;flex-direction:column;gap:3px}#mono-web .mw-item{justify-content:flex-start;width:100%;background:transparent;border:0;text-align:left;font-size:12px;padding:8px 10px}#mono-web .mw-active{background:var(--mw-hover);font-weight:500}#mono-web .mw-bottom .mw-item{display:flex;align-items:center;gap:8px}#mono-web .mw-bottom{margin-top:auto;border-top:1px solid var(--mw-line);padding-top:10px;display:flex;flex-direction:column;gap:4px}#mono-web .mw-main{display:flex;flex-direction:column;min-width:0;border-radius:0 10px 10px 0}#mono-web .mw-header{min-height:83px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 26px;border-bottom:1px solid var(--mw-line);background:var(--mw-glass);backdrop-filter:blur(16px);border-radius:0 10px 0 0}#mono-web h2,#mono-web h3,#mono-web p{margin:0}#mono-web h2{font-size:16px;font-weight:600}#mono-web .mw-sub{font-size:11px;color:var(--mw-muted);margin-top:3px}#mono-web .mw-header-tools{display:flex;gap:8px;margin-right:74px}#mono-web .mw-icon{padding:6px;width:32px;height:32px;background:transparent;border:0}#mono-web .mw-welcome{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:28px 20px}#mono-web .mw-mark{display:grid;place-items:center;width:46px;height:46px;background:var(--mw-panel);border:1px solid var(--mw-line);border-radius:var(--mw-radius);margin-bottom:5px}#mono-web .mw-welcome h3{font-size:26px;font-weight:500;letter-spacing:-.7px}#mono-web .mw-welcome p{font-size:12px;color:var(--mw-muted)}#mono-web .mw-suggestions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:12px}#mono-web .mw-suggestions button{font-size:12px}#mono-web .mw-compose-wrap{padding:0 26px 20px}#mono-web .mw-compose{border:1px solid var(--mw-line);background:var(--mw-panel);border-radius:calc(var(--mw-radius) + 3px)}#mono-web .mw-format{display:flex;gap:15px;padding:9px 16px 0;font-size:12px;color:var(--mw-muted)}#mono-web textarea{width:100%;height:72px;resize:none;border:0;background:transparent;padding:13px 16px;font-size:13px}#mono-web textarea::placeholder{color:var(--mw-muted)}#mono-web .mw-compose-actions{display:flex;align-items:center;gap:7px;padding:5px 12px 12px}#mono-web .mw-attachment{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mw-muted)}#mono-web .mw-model{margin-left:auto;border:0;background:transparent;padding:5px;font-size:11px}#mono-web .mw-send{width:32px;height:32px;padding:6px}#mono-web .mw-status{font-size:10px;color:var(--mw-muted);text-align:center;margin-top:9px;min-height:16px}#mono-web .mw-pop{position:absolute;right:28px;bottom:115px;z-index:3;background:var(--mw-glass);backdrop-filter:blur(18px);border:1px solid var(--mw-line);border-radius:calc(var(--mw-radius) + 3px);padding:9px;width:230px;box-shadow:0 12px 30px #00000012}#mono-web .mw-pop small{display:block;color:var(--mw-muted);font-size:10px;padding:4px 10px 7px}#mono-web .mw-settings{padding:24px 30px;min-width:0}#mono-web .mw-section{padding:0 0 18px;margin-bottom:19px;border-bottom:1px solid var(--mw-line)}#mono-web .mw-section h3{font-size:13px;font-weight:600;margin:0 0 15px}#mono-web .mw-row{display:grid;grid-template-columns:minmax(100px,1fr) minmax(140px,1.45fr);gap:20px;align-items:center;font-size:12px;margin:12px 0}#mono-web .mw-row input,#mono-web .mw-row select{width:100%;min-width:0;background:var(--mw-panel);border:1px solid var(--mw-line);border-radius:var(--mw-radius);padding:8px 10px;font-size:12px}#mono-web .mw-row small{display:block;color:var(--mw-muted);font-size:11px;margin-top:4px}#mono-web .mw-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--mw-text);justify-self:end}#mono-web .mw-actions{display:flex;justify-content:flex-end;gap:8px}#mono-web .mw-actions button{font-size:12px}#mono-web .mw-feedback{font-size:11px;color:var(--mw-muted);margin-top:12px;min-height:18px}
@media(max-width:720px){#mono-web .mw-window{grid-template-columns:170px minmax(0,1fr)}#mono-web .mw-sidebar{padding:20px 10px}#mono-web .mw-header{padding:15px 18px}#mono-web .mw-settings{padding:22px}#mono-web .mw-header-tools{margin-right:60px}}
@media(max-width:520px){#mono-web .mw-window{height:auto;min-height:730px;grid-template-columns:minmax(0,1fr)}#mono-web .mw-sidebar{padding:14px;border-right:0;border-bottom:1px solid var(--mw-line);border-radius:10px 10px 0 0;flex-direction:row;align-items:center;flex-wrap:wrap}#mono-web .mw-sidebar .mw-history,#mono-web .mw-sidebar .mw-search,#mono-web .mw-sidebar .mw-label,#mono-web .mw-sidebar .mw-bottom{display:none}#mono-web .mw-sidebar>.mw-item{width:auto}#mono-web .mw-brand{padding:0;margin-right:auto}#mono-web .mw-header{border-radius:0}#mono-web .mw-header-tools{display:none}#mono-web .mw-main{min-height:560px}#mono-web .mw-welcome h3{font-size:22px}#mono-web .mw-compose-wrap{padding:0 14px 20px}#mono-web .mw-model{max-width:145px;white-space:normal;text-align:right}#mono-web .mw-row{grid-template-columns:1fr;gap:6px}#mono-web .mw-row:has(input[type=checkbox]){grid-template-columns:1fr 24px}#mono-web .mw-pop{right:20px;bottom:140px}}
@media(prefers-reduced-motion:reduce){#mono-web button{transition:none}}
</style>
<div id="mono-web" data-theme="light" aria-label="AIPraat WebView 黑白灰概念预览">
<div class="viz-carousel" aria-label="WebView 预览场景" data-previous-label="上一页" data-next-label="下一页">
<section data-variant="声学助手" aria-label="声学助手界面">
<div class="mw-window"><aside class="mw-sidebar"><div class="mw-brand"><i data-lucide="audio-lines" aria-hidden="true"></i><div>Praat<small>声学助手</small></div></div><button type="button" class="mw-primary cursor-interaction" data-new><i data-lucide="plus" aria-hidden="true"></i>新建会话</button><label class="mw-search"><i data-lucide="search" aria-hidden="true"></i><input aria-label="搜索会话预览" placeholder="搜索会话与消息"></label><div class="mw-label">会话</div><div class="mw-history"><div class="mw-label">今天</div><button type="button" class="mw-item mw-active cursor-interaction">新会话</button><button type="button" class="mw-item cursor-interaction">元音音高与时长分析</button><div class="mw-label">昨天</div><button type="button" class="mw-item cursor-interaction">英语 VOT 测量</button><button type="button" class="mw-item cursor-interaction">发音练习与纠音建议</button></div><div class="mw-bottom"><div class="mw-item"><i data-lucide="list-checks" aria-hidden="true"></i>后台任务</div><div class="mw-item"><i data-lucide="settings-2" aria-hidden="true"></i>设置</div></div></aside><main class="mw-main"><header class="mw-header"><div><h2>新会话</h2><div class="mw-sub">本地模型 · 就绪</div></div><div class="mw-header-tools"><button type="button" class="mw-icon cursor-interaction" aria-label="模型浮层预览" data-trigger aria-expanded="false"><i data-lucide="sliders-horizontal" aria-hidden="true"></i></button></div></header><div class="mw-welcome"><div class="mw-mark"><i data-lucide="audio-lines" aria-hidden="true"></i></div><h3>我们应该做些什么</h3><p>测量声音、理解发音，让分析更清晰。</p><div class="mw-suggestions"><button type="button" class="cursor-interaction" data-prompt="分析音高与时长">分析音高与时长</button><button type="button" class="cursor-interaction" data-prompt="计算 VOT">计算 VOT</button><button type="button" class="cursor-interaction" data-prompt="获得纠音建议">获得纠音建议</button></div></div><div class="mw-compose-wrap"><div class="mw-compose"><div class="mw-format" aria-hidden="true"><b>B</b><em>I</em><span>〈〉</span><span>≡</span></div><textarea aria-label="分析目标预览" placeholder="描述你的分析目标，或附上音频与材料…"></textarea><div class="mw-compose-actions"><span class="mw-attachment"><i data-lucide="paperclip" aria-hidden="true"></i>添加附件</span><button type="button" class="mw-model cursor-interaction" data-trigger aria-expanded="false"><span data-model-label>local-model · auto</span><i data-lucide="chevron-down" aria-hidden="true"></i></button><button type="button" class="mw-primary mw-send cursor-interaction" data-send aria-label="发送反馈预览"><i data-lucide="arrow-up" aria-hidden="true"></i></button></div></div><div class="mw-status" aria-live="polite" data-status>设计预览 · 示例内容</div></div></main><div class="mw-pop" data-pop hidden><small>选择模型 · 示例</small><button type="button" class="mw-item mw-active cursor-interaction" data-model="local-model · auto">local-model · auto　✓</button><button type="button" class="mw-item cursor-interaction" data-model="cloud-model · auto">cloud-model · auto</button></div></div>
</section>
<section data-variant="设置与表单" aria-label="设置与表单界面" hidden><div class="mw-window"><aside class="mw-sidebar"><div class="mw-brand">设置</div><div class="mw-history"><div class="mw-item mw-active">模型</div><div class="mw-item">本地模型</div><div class="mw-item">音频与转写</div><div class="mw-item">发音与词典</div><div class="mw-item">会话与存储</div></div><div class="mw-bottom"><span class="mw-sub">AIPraat · 配置与资源</span></div></aside><main class="mw-main"><header class="mw-header"><div><h2>模型</h2><div class="mw-sub">连接方式与运行偏好</div></div><span class="mw-sub">示例配置</span></header><div class="mw-settings"><section class="mw-section"><h3>模型配置</h3><label class="mw-row"><span>运行方式<small>选择本地或云端服务</small></span><select><option>本地模型</option><option>云端模型</option></select></label><label class="mw-row"><span>模型名称</span><input value="local-model"></label><label class="mw-row"><span>上下文长度</span><select><option>自动</option><option>32K</option><option>64K</option></select></label></section><section class="mw-section"><h3>运行偏好</h3><label class="mw-row"><span>流式输出<small>逐步显示模型回复</small></span><input type="checkbox" checked></label><label class="mw-row"><span>工具调用确认<small>执行前显示操作信息</small></span><input type="checkbox" checked></label></section><div class="mw-actions"><button type="button" class="cursor-interaction" data-check>测试连接</button><button type="button" class="mw-primary cursor-interaction" data-save>保存设置</button></div><div class="mw-feedback" aria-live="polite" data-feedback>设计预览 · 示例配置</div></div></main></div></section>
</div></div>
<script>
(()=>{const root=document.getElementById('mono-web');const state={theme:'light',radius:7};function render(){root.dataset.theme=state.theme;root.style.setProperty('--mw-radius',state.radius+'px');}render();if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addSelect(state,'theme',{label:'外观',options:[{label:'纸白',value:'light'},{label:'石墨',value:'dark'}]});t.addSlider(state,'radius',{label:'圆角',min:0,max:12,unit:'px'});}const field=root.querySelector('textarea');const status=root.querySelector('[data-status]');root.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>{field.value=b.dataset.prompt;field.focus();}));root.querySelector('[data-new]').addEventListener('click',()=>{field.value='';status.textContent='设计预览 · 示例内容';});root.querySelector('[data-send]').addEventListener('click',()=>{status.textContent=field.value.trim()?'发送反馈示意 · 此预览不会发起分析':'请先填写分析目标';});const pop=root.querySelector('[data-pop]');const triggers=root.querySelectorAll('[data-trigger]');function close(){pop.hidden=true;triggers.forEach(b=>b.setAttribute('aria-expanded','false'));}triggers.forEach(b=>b.addEventListener('click',()=>{pop.hidden=!pop.hidden;triggers.forEach(t=>t.setAttribute('aria-expanded',String(!pop.hidden)));}));root.querySelectorAll('[data-model]').forEach(b=>b.addEventListener('click',()=>{root.querySelector('[data-model-label]').textContent=b.dataset.model;close();}));root.addEventListener('keydown',e=>{if(e.key==='Escape')close();});root.querySelector('[data-check]').addEventListener('click',()=>root.querySelector('[data-feedback]').textContent='连接反馈样式 · 此预览未连接服务');root.querySelector('[data-save]').addEventListener('click',()=>root.querySelector('[data-feedback]').textContent='保存反馈样式 · 实际配置未修改');})();
</script>
