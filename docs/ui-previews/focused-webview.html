<style>

@media(pointer:coarse) { #focused-webview button { min-height:40px; } #focused-webview .fw-send,#focused-webview .fw-icon { min-width:40px; } }

</style>

<script>
(()=>{
const root=document.getElementById('focused-webview');
const variants=root.querySelectorAll('[data-variant]');
variants[1].append(variants[0].querySelector('.fw-stage').cloneNode(true));
const state={theme:'light',wallpaper:'cool',opacity:72};
function render(){
 root.dataset.theme=state.theme;
 root.style.setProperty('--fw-opacity',String(state.opacity/100));
 const walls={cool:'linear-gradient(125deg,#c5cedd 0%,#d7d5df 46%,#d6c7c7 100%)',warm:'linear-gradient(125deg,#d8c5b9 0%,#ded3c5 48%,#c8ccd5 100%)',neutral:'linear-gradient(125deg,#bfc1c4,#dedede)'};
 root.style.setProperty('--fw-wall',walls[state.wallpaper]);
}
render();
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addSelect(state,'theme',{label:'外观',options:[{label:'纸白',value:'light'},{label:'石墨',value:'dark'}]});t.addSelect(state,'wallpaper',{label:'桌面底色模拟',options:[{label:'蓝灰',value:'cool'},{label:'暖灰',value:'warm'},{label:'中性灰',value:'neutral'}]});t.addSlider(state,'opacity',{label:'侧栏不透明度',min:58,max:95,step:1,unit:'%'});}
variants.forEach(variant=>{
 const status=variant.querySelector('.fw-status');const field=variant.querySelector('textarea');const pop=variant.querySelector('.fw-pop');const trigger=variant.querySelector('[data-model-trigger]');
 const close=()=>{pop.hidden=true;trigger.setAttribute('aria-expanded','false');};
 variant.querySelector('[data-collapse]').addEventListener('click',()=>variant.classList.toggle('fw-focus'));
 variant.querySelector('[data-new]').addEventListener('click',()=>{field.value='';status.textContent='新会话入口反馈 · 此处保留示例对话';});
 variant.querySelector('[data-send]').addEventListener('click',()=>status.textContent=field.value.trim()?'发送反馈示意 · 未发送真实请求':'请先填写内容');
 variant.querySelector('[data-copy]').addEventListener('click',()=>status.textContent='复制反馈示意');
 variant.querySelectorAll('[data-options]').forEach(b=>b.addEventListener('click',()=>status.textContent='控件尺寸与状态预览'));
 trigger.addEventListener('click',()=>{pop.hidden=!pop.hidden;trigger.setAttribute('aria-expanded',String(!pop.hidden));});
 variant.querySelectorAll('[data-model]').forEach(b=>b.addEventListener('click',()=>{trigger.firstChild.textContent=b.dataset.model;close();}));
 variant.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
 variant.querySelectorAll('.fw-history button').forEach(b=>b.addEventListener('click',()=>{variant.querySelectorAll('.fw-history button').forEach(x=>x.classList.toggle('fw-selected',x===b));status.textContent='侧栏选择样式预览 · 当前正文为示例';}));
});
})();
</script>
