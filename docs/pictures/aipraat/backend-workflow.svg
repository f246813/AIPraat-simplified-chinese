<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2370" viewBox="0 0 1200 2370" role="img">
<title>AI 对话窗口后端：宿主、API L0–L4 阶梯、本地模型与结果交付</title>
<desc>从 React 经宿主 RPC 创建任务，准备原目标材料与会话上下文。API 按目标路由到 L0 专用执行、L1 有限纠正、L2 证据解释、L3 原音频分析或 L4 一般讨论；本地 Qwen 使用独立循环。各分支持久保存执行事实和证据，再回传界面。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52746c"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9c7232"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.title{font-size:31px;font-weight:700;fill:#173c33}.subtitle{font-size:19px;fill:#536b64}.heading{font-size:24px;font-weight:700;fill:#173c33}.body{font-size:20px;fill:#405d53}.side{font-size:18px;fill:#405d53}.note{font-size:17px;fill:#526a61}.edge{fill:none;stroke:#52746c;stroke-width:2.2;stroke-linejoin:round;marker-end:url(#arrow)}.wire{fill:none;stroke:#52746c;stroke-width:2.2;stroke-linejoin:round}.return{fill:none;stroke:#9c7232;stroke-width:2.2;stroke-linejoin:round;stroke-dasharray:7 5;marker-end:url(#back)}</style>
<rect width="1200" height="2370" rx="22" fill="#f5f8f6"/>
<text class="title" x="50" y="55">AI 对话窗口 · 后端工作图</text>
<text class="subtitle" x="50" y="89">按任务与策略选路；阶梯中的每一层都有独立职责和进入条件。</text>
<rect x="50" y="125" width="340" height="150" rx="15" fill="#ffffff" stroke="#cddbd4" />
<text class="heading" x="70" y="162">React / assistant-ui</text>
<text class="body" x="70" y="199">提交文字、附件与继续动作</text>
<text class="body" x="70" y="229">RPC → 桌面 HostAPI</text>
<text class="body" x="70" y="259">接收 results / delta / activity</text>
<rect x="430" y="125" width="340" height="150" rx="15" fill="#ffffff" stroke="#cddbd4" />
<text class="heading" x="450" y="162">ModernApplication</text>
<text class="body" x="450" y="199">创建会话任务与取消标记</text>
<text class="body" x="450" y="229">配置、附件与原目标绑定</text>
<text class="body" x="450" y="259">工作线程调用执行适配器</text>
<rect x="810" y="125" width="340" height="150" rx="15" fill="#ffffff" stroke="#cddbd4" />
<text class="heading" x="830" y="162">本轮上下文准备</text>
<text class="body" x="830" y="199">对象与选区 / 音频快照</text>
<text class="body" x="830" y="229">历史、摘要与已有证据</text>
<text class="body" x="830" y="259">保存会话和阶段模型上下文</text>
<path class="edge" d="M390 200H430"/>
<path class="edge" d="M770 200H810"/>
<path class="edge" d="M980 275V330"/>
<rect x="50" y="330" width="1100" height="185" rx="15" fill="#e0efe8" stroke="#79aa95" />
<text class="heading" x="70" y="367">配置分流与任务路由</text>
<text class="body" x="70" y="404">API：工具任务 → L0；解释已有结果 → L2；原音频请求 → L3；一般讨论 → L4。</text>
<text class="body" x="70" y="434">本地模型：获取 llama-server 租约，进入独立 Qwen 规划循环。</text>
<text class="body" x="70" y="464">明确的时长／统计查询可直接测量；继续动作沿用原目标、材料和已有成功证据。</text>
<text class="body" x="70" y="494">宿主按阶段准备提示与技能目录，必要时压缩历史；直接测量无需模型规划，解释按策略追加。</text>
<text class="note" x="210" y="565">API：专用工具任务</text>
<path class="edge" d="M415 515V610"/>
<text class="note" x="927" y="565">本地模型</text>
<path class="edge" d="M1010 515V610"/>
<text class="note" x="37" y="546">L2 / L3 / L4 的直接入口</text>
<path class="edge" d="M50 445H18V1890H170"/>
<path class="edge" d="M18 1240H110"/>
<circle cx="18" cy="1240" r="3.5" fill="#52746c"/>
<path class="edge" d="M18 1570H140"/>
<circle cx="18" cy="1570" r="3.5" fill="#52746c"/>
<rect x="50" y="610" width="730" height="210" rx="15" fill="#e0efe8" stroke="#79aa95" />
<text class="heading" x="70" y="647">L0  专用工具执行</text>
<text class="body" x="70" y="684">LLM 原生 function calling + 注册工具 JSON Schema</text>
<text class="body" x="70" y="714">ToolGuards 核对对象、类型、范围与参数；按需加载技能</text>
<text class="body" x="70" y="744">同目标、同范围的成功证据可复用；无需重跑</text>
<text class="body" x="70" y="774">执行 Praat 工具，记录结果、单位、来源与实际投递状态</text>
<rect x="80" y="900" width="700" height="175" rx="15" fill="#ffffff" stroke="#cddbd4" />
<text class="heading" x="100" y="937">L1  有限纠正</text>
<text class="body" x="100" y="974">可修复的实际执行失败：每类问题允许 0–1 次有区别的纠正</text>
<text class="body" x="100" y="1004">纠正成功 → 回到 L0；相同失败调用不重复投递</text>
<text class="body" x="100" y="1034">依赖缺失、不支持、状态不明等原因 → 退出工具分支</text>
<path class="edge" d="M250 820V900"/>
<text class="note" x="270" y="861">可修复的执行失败</text>
<path class="return" d="M80 960H38V690H50"/>
<path class="edge" d="M780 695H803V1290H780"/>
<path class="wire" d="M780 990H803"/>
<circle cx="803" cy="990" r="3.5" fill="#52746c"/>
<text class="note" x="367" y="1121">已有证据与执行退出原因 → L2</text>
<rect x="110" y="1160" width="670" height="235" rx="15" fill="#e0efe8" stroke="#79aa95" />
<text class="heading" x="130" y="1197">L2  基于证据的目标解释</text>
<text class="body" x="130" y="1234">入口：工具执行结束，或用户要求解释已有结果</text>
<text class="body" x="130" y="1264">独立报告上下文，无执行工具；复用已保存的证据</text>
<text class="body" x="130" y="1294">逐项回答原目标，列出完成项与证据缺口</text>
<text class="body" x="130" y="1324">报告守卫核对数字、单位、对象、范围和引用</text>
<text class="body" x="130" y="1354">默认按需：15 秒、最多 2 次报告请求；策略可调整</text>
<rect x="140" y="1500" width="640" height="225" rx="15" fill="#ffffff" stroke="#cddbd4" />
<text class="heading" x="160" y="1537">L3  原目标音频分析</text>
<text class="body" x="160" y="1574">入口：显式请求；或 auto 策略下存在音频证据缺口</text>
<text class="body" x="160" y="1604">无测量且已有绑定音频时，auto 也可进入本层</text>
<text class="body" x="160" y="1634">核验原目标片段与音频能力 → 临时 PCM WAV 输入</text>
<text class="body" x="160" y="1664">模型定性听感与专业测量分别记来源和证据状态</text>
<text class="body" x="160" y="1694">材料不可用／音频能力拒绝 → 回 L2 使用已有证据</text>
<path class="edge" d="M430 1395V1500"/>
<text class="note" x="450" y="1442">报告确认缺原音频证据 + auto</text>
<path class="return" d="M740 1500V1395"/>
<rect x="170" y="1820" width="610" height="160" rx="15" fill="#ffffff" stroke="#cddbd4" />
<text class="heading" x="190" y="1857">L4  一般讨论 / 快速对话</text>
<text class="body" x="190" y="1894">入口：一般原理、科普、能力介绍或一般讨论继续</text>
<text class="body" x="190" y="1924">流式回复；工作流程可独立启用／关闭本层</text>
<text class="body" x="190" y="1954">不声称执行了工具或听过未实际输入的录音</text>
<rect x="865" y="610" width="290" height="210" rx="15" fill="#ffffff" stroke="#cddbd4" />
<text class="heading" x="885" y="647">本地 Qwen 路径</text>
<text class="side" x="885" y="684">宿主取得模型服务租约</text>
<text class="side" x="885" y="711">独立规划与工具调用循环</text>
<text class="side" x="885" y="738">默认最多 3 轮 / 5 个动作</text>
<text class="side" x="885" y="765">复用现有 Praat 调度器</text>
<text class="side" x="885" y="792">API 阶梯单独在左侧展开</text>
<rect x="865" y="900" width="290" height="235" rx="15" fill="#ffffff" stroke="#cddbd4" />
<text class="heading" x="885" y="937">共用工具执行层</text>
<text class="side" x="885" y="974">_Dispatcher / 串行锁</text>
<text class="side" x="885" y="1001">固定模板与脚本检查</text>
<text class="side" x="885" y="1028">Message.txt / sendpraat</text>
<text class="side" x="885" y="1055">完成标记 → 回读结果</text>
<text class="side" x="885" y="1082">刷新实际对象快照</text>
<text class="side" x="885" y="1109">状态不明 → 停止后续投递</text>
<rect x="865" y="1205" width="290" height="260" rx="15" fill="#ffffff" stroke="#cddbd4" />
<text class="heading" x="885" y="1242">API 的共享预算</text>
<text class="side" x="885" y="1279">每轮最多 12 个模型请求</text>
<text class="side" x="885" y="1306">20 次工具尝试，跨阶段共享</text>
<text class="side" x="885" y="1333">连续 2 轮无新增有效证据：</text>
<text class="side" x="885" y="1360">停止当前工具分支</text>
<text class="side" x="885" y="1387">取消时保留已完成记录</text>
<text class="side" x="885" y="1414">报告纠正不重跑对象操作</text>
<text class="side" x="885" y="1441">工具预算和 token 预算均检查</text>
<rect x="865" y="1525" width="290" height="245" rx="15" fill="#ffffff" stroke="#cddbd4" />
<text class="heading" x="885" y="1562">L3 自动升级条件</text>
<text class="side" x="885" y="1599">工作流允许 auto</text>
<text class="side" x="885" y="1626">音频输入已启用，材料可用</text>
<text class="side" x="885" y="1653">未取消且剩余请求预算足够</text>
<text class="side" x="885" y="1680">已核对报告指出音频缺口</text>
<text class="side" x="885" y="1707">音频发送、响应收到、</text>
<text class="side" x="885" y="1734">报告完成分别记录</text>
<path class="edge" d="M780 1335H840V2100"/>
<path class="wire" d="M780 1620H840"/>
<circle cx="840" cy="1620" r="3.5" fill="#52746c"/>
<path class="wire" d="M780 1900H840"/>
<circle cx="840" cy="1900" r="3.5" fill="#52746c"/>
<path class="edge" d="M1155 710H1182V2195H1150"/>
<text class="note" x="354" y="2057">工具结果、解释、一般回复或阶段记录</text>
<rect x="50" y="2100" width="1100" height="170" rx="15" fill="#e0efe8" stroke="#79aa95" />
<text class="heading" x="70" y="2137">保存事实 → 回传界面 → 按需继续</text>
<text class="body" x="70" y="2174">SQLite 保存消息、目标、材料元数据、证据与投递记录；实测结果可先于解释展示。</text>
<text class="body" x="70" y="2204">报告纠正失败：保留正文，遮蔽无法核对的数值并说明原因；无正文则交付阶段记录。</text>
<text class="body" x="70" y="2234">继续动作进入 L2 / L3 / L4，沿用原目标和成功证据；移动选区不会自行换掉原材料。</text>
<text class="note" x="50" y="2321">绿色实线：主路径或直接入口；棕色虚线：有条件的纠正／回退。L4 是独立入口，图中不从 L3 自动降级到 L4。</text>
</svg>
